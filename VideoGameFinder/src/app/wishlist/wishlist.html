<div class="wrapper">
<div class="container text-center">
        <div class="row justify-content-center">
        <h2 style="margin-top: 20px;">Wishlist</h2>
@for (wishlistData of gameAPI.wishlist();track wishlistData._id;) {
        <div class="col-md-4 col-sm-6 mb-4 d-flex flex-row justify-content-center">
        <div class="card" style="width: 24rem;">
        <a [routerLink]="['/game', wishlistData.gameId]">
        <img [src]="wishlistData.image" [alt]="wishlistData.name" class="card-img-top poster-img">
        {{wishlistData.name}}
        </a>
        <h3>Rating: {{wishlistData.rating}}</h3>
        <h3>Released: {{wishlistData.released}}</h3>
        <button (click)="gameAPI.deleteWishlistGame(wishlistData._id)">Remove From Wishlist</button>
</div>
</div>
}
</div>
</div>
</div>
