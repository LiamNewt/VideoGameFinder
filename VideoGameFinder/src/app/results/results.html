<div class="wrapper">
<div class="container text-center">
        <div class="row justify-content-center">
        <h2>Search Results</h2>
        @if(gameService.games().length === 0){
             <h3>No games to show..</h3>   
        } @else {
        <h3>Showing {{gameService.games().length}} Results</h3>
        }

@for (gameData of gameService.games().slice(0,9);track gameData;) {
        <div class="col-md-4 col-sm-6 mb-4 d-flex flex-row justify-content-center">
        <div class="card" style="width: 24rem;">
        <a [routerLink]="['/game', gameData.id]">
        <img [src]="gameData.background_image" [alt]="gameData.name" class="card-img-top poster-img">
        {{gameData.name}}
        </a>
</div>
</div>
}
</div>
</div>
</div>
<div class="d-flex justify-content-center mt-4">
        <button class="btn btn-secondary me-2" (click)="gameService.previousPage()" [disabled]="gameService.currentPage() ===1">Previous</button>
        <button class="btn btn-secondary" (click)="gameService.nextPage()" [disabled]="gameService.currentPage() === gameService.maxPages()">Next</button>
</div>
