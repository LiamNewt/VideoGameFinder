<div class="wrapper">
<main>
    <h1>Send us some feedback</h1>
    <form (ngSubmit)="submitForm()">
        <div class="mb-3">
            <label for = "name" class="form-label">Your Name</label>
            <input type="text" class="form-control" [(ngModel)]="contactData.name" id="userName" name="userName" placeholder="" required>
        </div>
        <div class="mb-3">
            <label for = "emailAddress" class="form-label">Your Email</label>
            <input type="email" class="form-control" [(ngModel)]="contactData.email" id="userEmail" name="userEmail" placeholder="name@example.com" required>
        </div>
        <div class="mb-3">
            <label for="userComment" class="form-label">Your Comment</label>
            <textarea class="form-control" [(ngModel)]="contactData.comment" id="userComment" name="userComment" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
    <br>
</main>    
</div>
