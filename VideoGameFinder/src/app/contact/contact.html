<main>
    <h1>Contact Form</h1>
    <form action = "submission" name = contactForm method="GET">
        <div class="mb-3">
            <label for = "name" class="form-label">Your Name</label>
            <input type="name" class="form-control" id="userName" name="userName" placeholder="" required>
        </div>
        <div class="mb-3">
            <label for = "emailAddress" class="form-label">Your Email</label>
            <input type="email" class="form-control" id="userEmail" name="userEmail" placeholder="name@example.com" required>
        </div>
        <div class="mb-3">
            <label for="userComment" class="form-label">Your Comment</label>
            <textarea class="form-control" id="userComment" name="userComment" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
    <br>
</main>    
    <script src="js/jquery-min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>    
    <script>
    $(document).ready(function(){
        // Wait for a submit
        $( "form" ).submit(function( event ) {
            var formValues=$( this ).serializeArray() ;
            console.log( formValues );
            localStorage.setItem('regForm', JSON.stringify(formValues));
            return false;
        });       
    });
    </script>
